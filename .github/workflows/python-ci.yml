name: Python CI

on:
  push:
    paths:
      - "automation/**"
      - "tests/**"
      - ".github/workflows/python-ci.yml"
  pull_request:
    paths:
      - "automation/**"
      - "tests/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile
        run: python -m py_compile automation/alert_triage.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v
